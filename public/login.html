<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Portal Login</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Welcome back</h1>
        <p>Sign in to access the secure file upload and download portal.</p>
        <form method="POST" action="/login">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="admin" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="password123" required />
          <button type="submit">Log in</button>
        </form>
        <div class="notice" style="margin-top: 16px;">
          Default credentials: <strong>admin</strong> / <strong>password123</strong>
        </div>
      </div>
    </div>
  </body>
</html>
